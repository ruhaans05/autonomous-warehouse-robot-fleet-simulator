<!doctype html>
<html lang="en">

    <title>Warehouse Fleet Simulator Demo</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #0b1118; color: #e9f0f5; }

  <body>
    <main>
      <p class="eyebrow">Autonomous Warehouse Robot Fleet Simulator</p>

      <video controls playsinline preload="metadata">
        <source src="warehouse-fleet-demo.mp4" type="video/mp4" />
